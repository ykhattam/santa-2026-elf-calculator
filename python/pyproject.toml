[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elf-verify-reference"
version = "0.1.0"
description = "Independent Python reference verifier for Santa 2026"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["elf_verify*"]
